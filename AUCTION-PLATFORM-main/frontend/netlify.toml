# Netlify Configuration inside frontend folder
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

[context.production.environment]
  NEXT_PUBLIC_API_URL = "https://auctionx-backend.onrender.com"
  NEXT_PUBLIC_WS_URL = "https://auctionx-backend.onrender.com"
