# Render Infrastructure Blueprint Configuration for AuctionX Platform
services:
  # 1. Backend API Web Service
  - type: web
    name: auctionx-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: APP_URL
        value: https://auctionx.netlify.app
      - key: API_URL
        value: https://auctionx-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: auctionx-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: auctionx-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: auctionx-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: auctionx-redis
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: COOKIE_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: MOCK
      - key: PAYMENT_SECRET_KEY
        value: sk_test_placeholder_key
      - key: PAYMENT_WEBHOOK_SECRET
        value: whsec_placeholder_key
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_DIR
        value: ./uploads
      - key: SMTP_HOST
        value: smtp.mailtrap.io
      - key: SMTP_PORT
        value: 2525
      - key: SMTP_USER
        value: placeholder_user
      - key: SMTP_PASS
        value: placeholder_pass
      - key: EMAIL_FROM
        value: "AuctionX Platform <noreply@auctionx.com>"

  # 2. Managed Redis Store
  - type: redis
    name: auctionx-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  # 3. Managed PostgreSQL Database Service
  - name: auctionx-db
    databaseName: auction_db
    user: postgres
    region: oregon
    plan: free
